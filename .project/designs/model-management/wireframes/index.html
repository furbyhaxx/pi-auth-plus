<style>
  :root { --bg:#16181d; --panel:#1d2026; --fg:#d7dae0; --dim:#6b7280; --muted:#9aa1ad; --accent:#7dcfff;

  .ctl button { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:3px 9px; cursor:pointer; font:inherit; font-size:13px; }
  .ctl button.on { border-color:var(--accent); color:var(--accent); }
  main { display:grid; grid-template-columns:minmax(0,auto) minmax(280px,420px); gap:18px; padding:18px; align-items:start; }
  @media (max-width:1100px) { main { grid-template-columns:1fr; } }

  .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .bold{font-weight:700} .sel{background:var(--sel)} .mag{color:var(--mag)}
  aside { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px 16px; font-size:13.5px; }
  aside h2 { font-size:14px; margin:4px 0 8px; }
  aside h3 { font-size:13px; margin:14px 0 4px; color:var(--accent); font-weight:600; }
  aside ul { margin:4px 0; padding-left:18px; } aside li { margin:2px 0; }
  aside code, kbd { font:12.5px ui-monospace,monospace; background:#262a31; padding:0 4px; border-radius:3px; }
  .tag { font-size:11px; border-radius:3px; padding:0 5px; margin-left:4px; }
  .t-ok { background:#24331f; color:var(--ok);} .t-warn{background:#3a3020;color:var(--warn);} .t-err{background:#3b2228;color:var(--err);}
  .note { color:var(--muted); font-size:12.5px; }

<body>
<header>
  <h1>pi-auth-plus · /auth model management</h1>
  <div class="ctl" id="views"></div>
  <div class="ctl" id="widths"></div>
  <div class="ctl"><button id="ctxbtn">Pi chrome</button></div>
</header>
<main>
  <div class="term" id="term" tabindex="0"><pre id="out"></pre></div>
  <aside id="notes"></aside>
</main>
<script>
"use strict";
// ---------- rendering primitives (mirror src/ui/frame) ----------
const W = { w: 80 };
const seg = (t, c) => ({ t: String(t), c: c || "" });
const vis = (line) => line.reduce((s, x) => s + [...x.t].length, 0);
function clip(line, width, ell = "…") {
  if (vis(line) <= width) return line;
  const out = []; let left = Math.max(0, width - [...ell].length);
  for (const s of line) { const ch = [...s.t]; if (left <= 0) break;
    if (ch.length <= left) { out.push(s); left -= ch.length; } else { out.push(seg(ch.slice(0, left).join(""), s.c)); left = 0; } }
  out.push(seg(ell, "dim")); return out;
}
const pad = (line, width) => { const c = clip(line, width); const n = width - vis(c); return n > 0 ? [...c, seg(" ".repeat(n))] : c; };
const padS = (t, w, c) => pad([seg(t, c)], w);
function rule(width, crumbs, right, color, center) {
  const dash = (n) => seg("─".repeat(Math.max(0, n)), color);
  const r = right ? [seg(" "), ...right, seg(" "), dash(2)] : [dash(2)];
  let cr = crumbs || []; const rw = vis(r);
  const cw = (l) => l.reduce((s, x) => s + [...x].length, 0) + 3 * (l.length - 1);
  while (cr.length > 1 && cw(cr) > width - rw - 6) cr = cr.slice(1);
  const left = cr.length ? [dash(2), seg(" ")] : [dash(2)];
  cr.forEach((c, i) => { if (i) left.push(seg(" › ", "dim")); left.push(seg(c, "bold")); });
  if (cr.length) left.push(seg(" "));
  const ctr = center ? [seg(" "), ...center, seg(" ")] : [];
  const fill = width - vis(left) - rw - vis(ctr);
  if (ctr.length && fill >= 2) { const a = Math.floor(fill / 2); return clip([...left, dash(a), ...ctr, dash(fill - a), ...r], width, ""); }
  return clip([...left, dash(width - vis(left) - rw), ...r], width, "");
}
function fitHint(items, width) {
  const kept = items.slice(); const plain = (l) => l.map(i => i[0] ? i[0] + " " + i[1] : i[1]).join(" · ").length;
  while (kept.length > 1 && plain(kept) > width) { let d = 0; kept.forEach((it, i) => { if (it[2] > kept[d][2]) d = i; }); kept.splice(d, 1); }
  const out = []; kept.forEach((it, i) => { if (i) out.push(seg(" · ", "dim")); if (it[0]) { out.push(seg(it[0], "dim"), seg(" ")); } out.push(seg(it[1], "muted")); });
  return out;
}
function tabsRow(active) {
  const out = []; TABS.forEach((t, i) => { if (i) out.push(seg("  ")); out.push(t === active ? seg("▸" + t, "acc bold") : seg(" " + t, "muted")); });
  return out;
}
function frame(spec) {
  const w = W.w; const lines = [];
  lines.push(rule(w, spec.crumbs, spec.state ? [seg(spec.state, "dim")] : null, "bA"));
  lines.push([seg(" "), ...tabsRow(spec.tab)]);
  for (const h of spec.header || []) lines.push([seg(" "), ...h]);
  for (const b of spec.body) lines.push(b);
  lines.push(rule(w, null, null, "b", spec.below ? [seg(`↓ ${spec.below} more`, "dim")] : null));
  lines.push([seg(" "), seg(spec.description)]);
  lines.push([seg(" "), ...fitHint(spec.hints, w - 1)]);
  lines.push(rule(w, null, null, "bA"));
  return lines.map(l => clip(l, w));
}
const cursor = (on) => on ? seg(" ❯ ", "acc") : seg("   ");
const section = (t) => [seg(" " + t, "bold")];

// ---------- illustrative data ----------
const OWNED = new Set(["claude", "antigravity", "synthetic"]);
const TABS = ["Providers", "Quotas", "Tokens", "Models", "Groups", "Settings"];
const CATALOG = [
  ["opencode", "big-pickle", "200K"], ["opencode", "deepseek-free", "128K"], ["opencode", "glm-5.3-free", "200K"],
  ["opencode", "grok-code-fast", "256K"], ["antigravity", "claude-sonnet-5", "200K"], ["antigravity", "claude-opus-5", "200K"],
  ["antigravity", "gemini-4-argon", "1M"], ["openrouter", "anthropic/claude-sonnet-5", "1M"], ["openrouter", "stealth-wren", "256K"],
  ["openrouter", "google/gemini-4-argon", "1M"], ["openrouter", "deepseek/deepseek-v4.1", "160K"], ["openai", "gpt-6", "400K"],
  ["openai", "gpt-6-mini", "400K"], ["claude", "claude-opus-5", "200K"], ["claude", "claude-sonnet-5", "200K"],
  ["synthetic", "hf:deepseek-ai/DeepSeek-V4.1", "160K"], ["synthetic", "hf:zai-org/GLM-5.3", "200K"], ["xai", "grok-5", "256K"],
];
const S = {
  view: "rules", sel: 0, editing: null, chrome: true,
  rules: [
    { p: "opencode/*", on: true }, { p: "!opencode/deepseek-free", on: true }, { p: "antigravity/*claude*", on: true },
    { p: "openrouter/*", on: true }, { p: "!openrouter/stealth*", on: true }, { p: "!openrouter/google/*argon*", on: true },
  ],
  mode: "hide", // rules list what to hide; "!" re-shows
  scope: "user",
  overrides: { "openai/gpt-6": { contextWindow: ["272K", "400K"] }, "claude/claude-opus-5": { maxTokens: ["64K", "32K"] } },
  aliases: [ { id: "openai/gpt-6-1m", of: "openai/gpt-6", ctx: "1M", note: "alias" } ],
  groups: [
    { id: "group/deepseek-v4.1", name: "DeepSeek V4.1", strategy: "sticky · failover", members: [
      ["synthetic", "hf:deepseek-ai/DeepSeek-V4.1", "160K", "ok", "5h 41%", "included"],
      ["opencode", "deepseek-free", "128K", "warn", "rate-limited 2m", "free"],
      ["openrouter", "deepseek/deepseek-v4.1", "160K", "ok", "$48.20", "paid"],
      ["deepseek", "deepseek-v4.1", "128K", "dim", "not signed in", "paid"] ] },
    { id: "group/claude-any", name: "Claude, any route", strategy: "balance", members: [
      ["claude", "claude-sonnet-5", "200K", "ok", "5h 63%", "included"],
      ["antigravity", "claude-sonnet-5", "200K", "ok", "arg 22%", "included"] ] },
  ],
};
// glob: * does not cross "/", ** does
function globRe(p) { return new RegExp("^" + p.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*\*/g, "\u0000").replace(/\*/g, "[^/]*").replace(/\u0000/g, ".*").replace(/\?/g, "[^/]") + "$"); }
function evaluate(id) {
  let hidden = false, by = null;
  S.rules.forEach((r, i) => { if (!r.on) return; const neg = r.p.startsWith("!"); const pat = neg ? r.p.slice(1) : r.p;
    if (globRe(pat).test(id) || globRe(pat + "/**").test(id)) { hidden = !neg; by = i; } });
  return { hidden, by };
}

// ---------- views ----------
const VIEWS = {
  rules: { tab: "Models", label: "Models · rules", render: viewRules },
  catalog: { tab: "Models", label: "Models · catalog", render: viewCatalog },
  detail: { tab: "Models", label: "Model detail + alias", render: viewDetail },
  groups: { tab: "Groups", label: "Groups", render: viewGroups },
  group: { tab: "Groups", label: "Group detail", render: viewGroup },
  settings: { tab: "Settings", label: "Settings additions", render: viewSettings },
};

function viewRules() {
  const w = W.w, body = [];
  const res = CATALOG.map(([p, m]) => evaluate(`${p}/${m}`));
  const hidden = res.filter(r => r.hidden).length;
  body.push(section(`Rules · ${S.scope} scope · last match wins · ! shows again`));
  S.rules.forEach((r, i) => {
    const n = CATALOG.filter((c, k) => res[k].by === i).length;
    const neg = r.p.startsWith("!");
    const left = [cursor(S.sel === i), seg(String(i + 1).padStart(2) + " ", "dim"), seg(r.on ? r.p : r.p, r.on ? (neg ? "ok" : "warn") : "dim")];
    const prov = (neg ? r.p.slice(1) : r.p).split("/")[0];
    const owned = OWNED.has(prov);
    const right = r.on ? `${n} ${neg ? "shown" : "hidden"}` : "off";
    const rw = w >= 57 ? 26 : 12;
    const lw = Math.max(10, w - rw - 2);
    const tail = r.on && !owned && w >= 57 ? " · needs Pi hook" : "";
    body.push([...pad(left, lw), ...padS(right.padStart(10), 10, "dim"), ...padS(tail, rw - 10, "warn")]);
  });
  body.push([cursor(S.sel === S.rules.length), seg("+ add rule", "muted")]);
  body.push([seg("")]);
  body.push([seg(" Effect  ", "bold"), seg(`${CATALOG.length - hidden} listed`, "ok"), seg(" · ", "dim"), seg(`${hidden} hidden`, "warn"),
             seg(" · applies to pi --list-models, --model, /model, cycling", "dim")]);
  const editing = S.editing !== null;
  return {
    state: `${hidden} hidden`, crumbs: ["Auth", "Models"], body,
    header: [[seg(" Rules", "acc"), seg("  ·  Catalog", "muted")]],
    description: editing ? "Pattern: * stays within one path segment, ** crosses /, leading ! shows again" : "Ordered hide rules. A later rule overrides an earlier one.",
    hints: editing ? [["enter", "apply", 1], ["esc", "cancel", 1]] :
      [["tab", "switch", 1], ["v", "catalog", 2], ["a", "add", 2], ["enter", "edit", 2], ["space", "on/off", 3], ["shift+↑↓", "reorder", 3], ["d", "delete", 4], ["ctrl+s", "save", 1], ["esc", "close", 1]],
    notes: notesRules,
  };
}
function viewCatalog() {
  const w = W.w, body = []; let shownN = 0;
  let lastP = "";
  CATALOG.forEach(([p, m, ctx], i) => {
    const id = `${p}/${m}`; const r = evaluate(id); if (!r.hidden) shownN++;
    if (p !== lastP) { body.push(section(p)); lastP = p; }
    const ov = S.overrides[id]; const al = S.aliases.filter(a => a.of === id);
    const mark = r.hidden ? seg("○ ", "dim") : seg("● ", "ok");
    const why = r.hidden ? `hidden · rule ${r.by + 1}` : ov ? "override" : r.by !== null ? `rule ${r.by + 1}` : "";
    const ctxShown = ov && ov.contextWindow ? ov.contextWindow[1] : ctx;
    const whyW = w >= 57 ? 16 : 0; const nameW = Math.max(12, w - 10 - whyW);
    body.push([cursor(S.sel === i), mark, ...pad([seg(m, r.hidden ? "dim" : "")], nameW - 5), seg(ctxShown.padStart(5), ov ? "mag" : "muted"), seg("  "), ...(whyW ? padS(why, whyW, "dim") : [])]);
    al.forEach(a => body.push([seg("     "), seg("↳ ", "dim"), ...pad([seg(a.id.split("/")[1], "acc")], nameW - 5), seg(a.ctx.padStart(5), "mag"), seg("  "), ...(whyW ? padS("alias", whyW, "dim") : [])]));
  });
  const max = Math.max(6, (S.chrome ? 22 : 30) - 8);
  const sel = Math.min(S.sel, CATALOG.length - 1);
  return {
    state: `${shownN}/${CATALOG.length} listed`, crumbs: ["Auth", "Models"], body: body.slice(0, max), below: Math.max(0, body.length - max),
    header: [[seg("  Rules  ·  ", "muted"), seg("Catalog", "acc")]],
    description: "● listed  ○ hidden. Pink limits are overrides; ↳ rows are aliases.",
    hints: [["tab", "switch", 1], ["v", "rules", 2], ["/", "filter", 2], ["enter", "edit", 1], ["h", "hide/show", 2], ["n", "new alias", 3], ["esc", "close", 1]],
    notes: notesCatalog,
  };
}
function viewDetail() {
  const w = W.w, body = []; const lw = Math.min(24, Math.floor(w * 0.42));
  const row = (i, label, val, src, cls) => body.push([cursor(S.sel === i), ...padS(label, lw - 1), seg(" "), ...pad([seg(val, cls || "")], w - lw - 13), ...padS(src.padStart(9), 9, src === "default" ? "dim" : "mag")]);
  body.push(section("openai/gpt-6 · openai-codex-responses"));
  row(0, "Name", "GPT-6", "default");
  row(1, "Context window", "272K", "override");
  row(2, "Max output", "128K", "default");
  row(3, "Reasoning", "on · low…xhigh", "default");
  row(4, "Input", "text, image", "default");
  row(5, "Verbosity", "medium", "override");
  row(6, "Visible", "listed", "default");
  body.push(section("Aliases"));
  body.push([cursor(S.sel === 7), ...padS("gpt-6-1m", lw, "acc"), ...pad([seg("1M ctx · sends gpt-6", "muted")], w - lw - 13), ...padS("alias".padStart(9), 9, "mag")]);
  body.push([cursor(S.sel === 8), seg("+ new alias of gpt-6", "muted")]);
  return {
    state: "2 overrides", crumbs: ["Auth", "Models", "gpt-6"], body,
    header: [[seg("  Rules  ·  ", "muted"), seg("Catalog", "acc")]],
    description: S.sel === 1 ? "Catalog says 400K. Lower values compact earlier; higher values are refused by the provider." :
                 S.sel === 5 ? "OpenAI text.verbosity for this model; Pi sends low by default." :
                 S.sel === 7 ? "Alias: own id, limits and settings; sends the upstream id gpt-6 with the same login." : "Overrides are stored in models.json modelOverrides.",
    hints: [["enter", "edit", 1], ["←/→", "change", 2], ["backspace", "reset", 3], ["ctrl+s", "save", 1], ["esc", "back", 1]],
    notes: notesDetail,
  };
}
function viewGroups() {
  const w = W.w, body = [];
  S.groups.forEach((g, i) => {
    const healthy = g.members.filter(m => m[3] === "ok").length;
    body.push([cursor(S.sel === i), ...pad([seg(g.id, "acc")], Math.max(14, w - 30)), ...padS(g.strategy, 18, "muted"), seg(` ${healthy}/${g.members.length}`, healthy ? "ok" : "err")]);
    body.push([seg("     "), seg(g.members.map(m => m[0]).join(" → "), "dim")]);
  });
  body.push([cursor(S.sel === S.groups.length), seg("+ new group", "muted")]);
  return {
    state: `${S.groups.length} groups`, crumbs: ["Auth", "Groups"], body,
    description: "Groups appear as selectable models; each request routes to one member.",
    hints: [["tab", "switch", 1], ["enter", "open", 1], ["n", "new", 2], ["d", "delete", 3], ["esc", "close", 1]],
    notes: notesGroups,
  };
}
function viewGroup() {
  const g = S.groups[0], w = W.w, body = []; const lw = Math.min(22, Math.floor(w * 0.4));
  const kv = (i, k, v, cls) => body.push([cursor(S.sel === i), ...padS(k, lw - 1), seg(" "), seg(v, cls || "")]);
  kv(0, "Strategy", "sticky · failover", "");
  kv(1, "Fail over on", "429, quota, 5xx before output", "");
  kv(2, "Paid members", "only when free ones fail", "warn");
  kv(3, "Context window", "128K · smallest member", "muted");
  kv(4, "Thinking", "high → max · medium → high", "muted");
  body.push(section("Members · order = preference"));
  g.members.forEach((m, k) => {
    const i = 5 + k; const nameW = Math.max(10, w - 52);
    body.push([cursor(S.sel === i), seg(`${k + 1} `, "dim"), ...padS(m[0], 12), ...pad([seg(m[1])], nameW), ...padS(m[2].padStart(5), 6, "muted"),
      ...padS(" " + m[4], 17, m[3]), ...padS(m[5], 9, m[5] === "paid" ? "warn" : "dim")]);
  });
  body.push([cursor(S.sel === 9), seg("+ add member", "muted")]);
  return {
    state: "sticky → synthetic", crumbs: ["Auth", "Groups", g.name], body,
    description: S.sel === 1 ? "Never fails over after output or a tool call started; the turn errors instead." :
                 S.sel === 2 ? "Paid members are skipped unless every included or free member is unavailable." :
                 "Session stays on its member until it fails; failover moves the session.",
    hints: [["enter", "edit", 1], ["←/→", "change", 2], ["shift+↑↓", "reorder", 2], ["a", "add", 3], ["d", "remove", 3], ["ctrl+s", "save", 1], ["esc", "back", 1]],
    notes: notesGroup,
  };
}
function viewSettings() {
  const w = W.w, body = []; const lw = Math.min(29, Math.floor(w * 0.45));
  const row = (i, k, v, src) => body.push([cursor(S.sel === i), ...padS(k, lw - 1), seg(" "), ...pad([seg(v)], Math.max(6, w - lw - 13)), ...padS((src || "default").padStart(9), 9, src ? "mag" : "dim")]);
  body.push(section("Models"));
  row(0, "Model rules scope", "user + trusted project");
  row(1, "Hidden default model", "warn and keep");
  body.push(section("OpenAI"));
  row(2, "Response verbosity", "medium", "user");
  row(3, "Verbosity scope", "openai, openai-codex");
  body.push(section("Web search"));
  row(4, "Web search tool", "on", "user");
  row(5, "Search backends", "synthetic, exa, claude, codex, xai");
  row(6, "Result kind", "results, else answer");
  row(7, "Allow paid backends", "off");
  return {
    state: "9 providers", crumbs: ["Auth", "Settings"], body,
    description: [
      "Where model rules are read from; project rules need project trust.",
      "When the saved default model is hidden: keep it and warn, or fall back.",
      "OpenAI text.verbosity: low, medium, high, or Pi default (low).",
      "Providers whose GPT requests get the verbosity override.",
      "Registers one web_search tool; replaces synthetic_web_search.",
      "Order tried; only signed-in backends with verified search access are offered.",
      "results: raw hits and page text; answer: model summary with citations.",
      "Never use a separately billed backend unless on.",
    ][Math.min(S.sel, 7)],
    hints: [["tab", "switch", 1], ["enter", "edit", 1], ["ctrl+s", "save", 1], ["↑/↓", "move", 2], ["←/→", "change", 2], ["esc", "close", 1]],
    notes: notesSettings,
  };
}

// ---------- notes per view ----------
const li = (a) => "<ul>" + a.map(x => `<li>${x}</li>`).join("") + "</ul>";
function notesRules() { return `<h2>Models › Rules</h2>
<p class="note">Your rule list from the idea note, evaluated live against the illustrative catalog. Try <kbd>space</kbd> on a rule.</p>
<h3>Behaviour</h3>${li(["Default: everything listed. A rule hides; <code>!rule</code> shows again. Last matching rule wins (gitignore).",
"<code>*</code> stays in one segment, <code>**</code> crosses <code>/</code>. <code>openrouter/*</code> therefore also needs to match <code>openrouter/google/x</code>: a provider-only pattern matches the whole provider.",
"Saved to <code>auth-plus.json</code> (user) or trusted project settings. User rules are read in the extension factory, so owned providers drop hidden ids before <code>--list-models</code>; project rules apply from session start (trust is unknown earlier)."])}
<h3>Open decisions</h3>${li(["Default-visible + hide rules (shown) vs. default-hidden allowlist.", "Should <code>/model</code> show hidden models greyed with a toggle?"])}
<h3>Evidence</h3><p class="note">Pi 1.4 has no seam that hides a built-in model everywhere (<code>--model</code> still resolves). Owned families (claude, antigravity, synthetic) can drop ids now; built-ins need the upstream visibility hook. Rules on other providers are saved but marked <code>needs Pi hook</code> until that lands.</p>`; }
function notesCatalog() { return `<h2>Models › Catalog</h2>${li(["Every model Pi knows, grouped by provider, with the rule that decided it.",
"<kbd>h</kbd> on a row appends a rule (<code>openai/gpt-6-mini</code> or <code>!…</code>) rather than toggling a hidden flag, so the rule list stays the single source.",
"Pink context = <code>modelOverrides</code>; <code>↳</code> = alias."])}`; }
function notesDetail() { return `<h2>Model detail</h2>${li(["Same row layout as Settings: label · value · source (<code>default</code>/<code>override</code>).",
"Writes <code>models.json</code> <code>modelOverrides</code> — Pi's own store, read before <code>--list-models</code>.",
"Verbosity only appears for OpenAI Responses-based models.", "Aliases: mechanism decided by the virtual-groups probe (virtual model vs. duplicated provider entry)."])}`; }
function notesGroups() { return `<h2>Groups</h2>${li(["A group is a selectable model id <code>group/&lt;name&gt;</code> (Pi virtual model).",
"Second line shows the member order at a glance; the count is healthy members.", "Health uses quota snapshots and sign-in state; unknown is not healthy."])}`; }
function notesGroup() { return `<h2>Group detail</h2>${li(["Strategies: <b>sticky</b> (default), <b>failover</b>, <b>balance</b> (lowest quota use), <b>random</b>.",
"Failover boundary: only before the first output token and never across a tool call.", "Members show auth/quota live; paid members marked.",
"Group limits default to the smallest member; editable down, never above a member."])}
<h3>Open decisions</h3>${li(["Cross-provider failover breaks prompt cache and thinking signatures: allow by default?", "Should balance consider cost or only quota headroom?"])}`; }
function notesSettings() { return `<h2>Settings additions</h2>${li(["New sections in the existing Settings tab; same row format, staged save with scope dialog.",
"Web search registers one <code>web_search</code> tool. Its tool-call rendering stays Pi's default, like <code>synthetic_web_search</code> today.",
"Verified live 2026-10-28: synthetic + exa return raw hits; claude, openai, codex, xai return cited answers (each a full model call, ~17-21K input tokens).", "Verbosity verified live on openai and openai-codex: low/medium/high accepted, output length grows with level."])}`; }

// ---------- chrome + loop ----------
function render() {
  const v = VIEWS[S.view]; const spec = v.render(); spec.tab = v.tab;
  const lines = frame(spec);
  const ctxTop = S.chrome ? [[seg(" … transcript …", "ctx")]] : [];
  const ctxBot = S.chrome ? [
    [seg(" or: $48.20 · cox: 5h 12% 7d 40% · cl: 5h 63% 7d 21%", "ctx")],
    [seg(" /mnt/Projects/furbyhaxx/pi-auth-plus (dev)", "ctx")],
    [seg(" 0.0%/272k (auto)", "ctx"), seg(" ".repeat(Math.max(1, W.w - 50))), seg("(openai) gpt-6 • medium", "ctx")]].map(l => clip(l, W.w)) : [];
  const html = [...ctxTop, ...lines, ...ctxBot].map(l => l.map(s => s.c ? `<span class="${s.c}">${esc(s.t)}</span>` : esc(s.t)).join("")).join("\n");
  document.getElementById("out").innerHTML = html;
  document.getElementById("notes").innerHTML = spec.notes() + `<h3>Keys in this preview</h3><p class="note">Click the terminal, then ↑/↓, enter, esc, tab, v, space, shift+↑/↓, d, a, h. Width buttons switch 36/57/80/140.</p>`;
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
  document.querySelector("main").classList.toggle("wide", W.w >= 140);
  document.querySelectorAll("#widths button").forEach(b => b.classList.toggle("on", +b.dataset.w === W.w));
}
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function rows() { return { rules: S.rules.length + 1, catalog: CATALOG.length, detail: 9, groups: S.groups.length + 1, group: 10, settings: 8 }[S.view]; }
const ORDER = ["rules", "groups", "settings"];
document.getElementById("term").addEventListener("keydown", (e) => {
  const n = rows(); let h = true;
  if (e.key === "ArrowDown" && e.shiftKey && S.view === "rules" && S.sel < S.rules.length - 1) { [S.rules[S.sel], S.rules[S.sel + 1]] = [S.rules[S.sel + 1], S.rules[S.sel]]; S.sel++; }
  else if (e.key === "ArrowUp" && e.shiftKey && S.view === "rules" && S.sel > 0) { [S.rules[S.sel], S.rules[S.sel - 1]] = [S.rules[S.sel - 1], S.rules[S.sel]]; S.sel--; }
  else if (e.key === "ArrowDown") S.sel = Math.min(n - 1, S.sel + 1);
  else if (e.key === "ArrowUp") S.sel = Math.max(0, S.sel - 1);
  else if (e.key === "Tab") { const i = ORDER.indexOf(VIEWS[S.view].tab === "Models" ? "rules" : S.view === "group" ? "groups" : S.view); S.view = ORDER[(i + (e.shiftKey ? 2 : 1)) % 3]; S.sel = 0; }
  else if (e.key === "v" && (S.view === "rules" || S.view === "catalog")) { S.view = S.view === "rules" ? "catalog" : "rules"; S.sel = 0; }
  else if (e.key === " " && S.view === "rules" && S.rules[S.sel]) S.rules[S.sel].on = !S.rules[S.sel].on;
  else if (e.key === "d" && S.view === "rules" && S.rules[S.sel]) S.rules.splice(S.sel, 1);
  else if ((e.key === "a" || (e.key === "Enter" && S.sel === S.rules.length)) && S.view === "rules") { const p = prompt("Rule (prefix ! to show again)", "!openai/gpt-6-mini"); if (p) S.rules.push({ p, on: true }); }
  else if (e.key === "Enter" && S.view === "rules") { const r = S.rules[S.sel]; const p = prompt("Edit rule", r.p); if (p) r.p = p; }
  else if (e.key === "h" && S.view === "catalog") { const [p, m] = CATALOG[S.sel]; const id = `${p}/${m}`; S.rules.push({ p: evaluate(id).hidden ? "!" + id : id, on: true }); }
  else if (e.key === "Enter" && S.view === "catalog") { S.view = "detail"; S.sel = 1; }
  else if (e.key === "Enter" && S.view === "groups") { S.view = "group"; S.sel = 0; }
  else if (e.key === "Escape" && S.view === "detail") { S.view = "catalog"; S.sel = 11; }
  else if (e.key === "Escape" && S.view === "group") { S.view = "groups"; S.sel = 0; }
  else h = false;
  if (h) { e.preventDefault(); render(); }
});
const vb = document.getElementById("views");
Object.entries(VIEWS).forEach(([k, v]) => { const b = document.createElement("button"); b.textContent = v.label; b.dataset.v = k; b.onclick = () => { S.view = k; S.sel = k === "detail" ? 1 : 0; render(); document.getElementById("term").focus(); }; vb.appendChild(b); });
const wb = document.getElementById("widths");
[36, 57, 80, 140].forEach(w => { const b = document.createElement("button"); b.textContent = w + " cols"; b.dataset.w = w; b.onclick = () => { W.w = w; render(); }; wb.appendChild(b); });
document.getElementById("ctxbtn").onclick = () => { S.chrome = !S.chrome; render(); };
const q = new URLSearchParams(location.search);
if (VIEWS[q.get("view")]) { S.view = q.get("view"); S.sel = +(q.get("sel") || (S.view === "detail" ? 1 : 0)); }
if ([36, 57, 80, 140].includes(+q.get("w"))) W.w = +q.get("w");
if (q.get("chrome") === "0") S.chrome = false;
render(); document.getElementById("term").focus();
</script>
</body>
